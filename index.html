<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>BlockStrike Survival 3D</title>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="topbar">
      <div class="brand">⬡ BLOCKSTRIKE <small>SURVIVAL 3D</small></div>
      <div class="stats"><span id="health">♥ 100</span><span id="clock">☀ 08:00</span><span id="weather">☀ CERAH</span></div>
    </div>
    <div id="toast">Cari sumber daya dan bertahan hidup.</div>
    <div class="crosshair"><i></i><b></b></div>
    <div class="bottom">
      <div class="left-controls">
        <div id="joystick"><div id="stick"></div></div>
        <span class="hint">GERAK</span>
      </div>
      <div class="right-controls">
        <button id="build" class="action">▦<small>BLOK</small></button>
        <button id="jump" class="action">⬆<small>LOMPAT</small></button>
        <button id="shoot" class="action fire">✦<small>TEMBAK</small></button>
      </div>
    </div>
    <div class="toolrow">
      <button id="mode">MODE: HANCURKAN</button>
      <button id="weatherBtn">CUACA</button>
      <button id="save">SIMPAN</button>
      <button id="reset">ULANG</button>
    </div>
    <div id="help">Geser sisi kanan layar untuk melihat • Tap blok untuk membangun/menghancurkan</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
